<div class="linked-list-page">

    <header class="page-header">

        <div>

            <h1>Linked List</h1>

            <p>Singly Linked List</p>

        </div>

        <div class="header-actions">

            <div class="info-chip">

                <div class="av-chip av-chip-warning">
                    <span class="label">Nodes :</span>
                    <span class="value">{{count()}}</span>
                </div>

            </div>

            <button mat-flat-button class="av-btn btn-danger" (click)="reset()" [disabled]="execution.state().playing">

                <mat-icon>restart_alt</mat-icon>

                Reset

            </button>

        </div>

    </header>

    <section class="controls-card">

        <div class="controls">

            <mat-form-field appearance="outline">

                <mat-label>Insert Value</mat-label>

                <input matInput type="number" [(ngModel)]="insertValue">

            </mat-form-field>

            <button mat-flat-button class="av-btn btn-primary" (click)="insertFront()"
                [disabled]="execution.state().playing">

                <mat-icon>first_page</mat-icon>

                Insert Front

            </button>

            <button mat-flat-button class="av-btn btn-primary" (click)="insertEnd()"
                [disabled]="execution.state().playing">

                <mat-icon>last_page</mat-icon>

                Insert End

            </button>

            <button mat-flat-button class="av-btn btn-purple" (click)="deleteFront()"
                [disabled]="execution.state().playing || isEmpty()">

                <mat-icon>keyboard_double_arrow_left</mat-icon>

                Delete Front

            </button>

            <button mat-flat-button class="av-btn btn-purple" (click)="deleteEnd()"
                [disabled]="execution.state().playing || isEmpty()">

                <mat-icon>keyboard_double_arrow_right</mat-icon>

                Delete End

            </button>

            <mat-form-field appearance="outline">

                <mat-label>Search Value</mat-label>

                <input matInput type="number" [(ngModel)]="searchValue">

            </mat-form-field>

            <button mat-flat-button class="av-btn btn-success" (click)="search()"
                [disabled]="execution.state().playing || isEmpty()">

                <mat-icon>search</mat-icon>

                Search

            </button>

        </div>

    </section>

    <section class="workspace">

        <section class="visualizer">

            @if(count()) {

            <div class="list-container">

                <div class="head-pointer">

                    HEAD

                    <mat-icon>

                        south

                    </mat-icon>

                </div>

                <div class="list-row">

                    @for(node of nodes(); track $index) {

                    <div class="node-wrapper">

                        <div class="list-node" [class.active]="node.active" [class.current]="node.current"
                            [class.visited]="node.visited" [class.found]="node.found">

                            <div class="node-data">

                                {{node.value}}

                            </div>

                            <div class="node-pointer">

                                ●

                            </div>

                        </div>

                        @if($index !== count() - 1){

                        <div class="next-arrow"></div>

                        } @else {
                        <div class="next-arrow"></div>

                        <div class="null-pointer">

                            NULL

                        </div>

                        }

                    </div>

                    }

                </div>

            </div>

            } @else {

            <div class="empty-state">

                <p>

                    Insert a value to create the first node.

                </p>

            </div>

            }

        </section>

        <app-operation-panel [code]="code()" [activeLine]="execution.state().activeLine"
            [execution]="executionStatus()">
        </app-operation-panel>

    </section>

</div>
