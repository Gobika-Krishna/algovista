<div class="tree-page">

    <!-- Header -->

    <div class="page-header">

        <div>
            <h1>Binary Tree</h1>
            <p>Complete Binary Tree Visualization</p>
        </div>

        <div class="tree-info">
            <span>Nodes : {{ size() }}</span>
        </div>

    </div>

    <!-- Controls -->

    <div class="controls">

        <mat-form-field appearance="outline">
            <mat-label>Node Value</mat-label>

            <input matInput type="number" [(ngModel)]="value" (keyup.enter)="insert()">
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="insert()">

            Insert

        </button>

        <button mat-raised-button color="warn" (click)="reset()">

            Reset

        </button>

    </div>

    <!-- Workspace -->

    <div class="workspace">

        <!-- Visualization -->

        <section class="visualizer">

            @if(root()){

            <app-tree-renderer [root]="root()">
            </app-tree-renderer>

            } @else {

            <div class="empty-tree">

                Empty Tree

            </div>

            }

        </section>

        <!-- Side Panel -->

        <aside class="side-panel">

            <div class="panel">

                <h3>History</h3>

                @if(history().length){

                @for(item of history(); track $index){

                <div class="history-item">

                    {{item}}

                </div>

                }

                } @else {

                <p>No Operations</p>

                }

            </div>

            <div class="panel">

                <h3>Complexity</h3>

                <div class="complexity">
                    <span>Insert</span>
                    <strong>O(n)</strong>
                </div>

                <div class="complexity">
                    <span>Search</span>
                    <strong>O(n)</strong>
                </div>

                <div class="complexity">
                    <span>Traversal</span>
                    <strong>O(n)</strong>
                </div>

            </div>

        </aside>

    </div>

</div>
